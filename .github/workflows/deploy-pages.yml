# .github/workflows/deploy-pages.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby ruby-dev \
            fonts-paratype \
            fonts-firacode \
            nodejs npm

      - name: Install Mermaid CLI
        run: sudo npm install -g @mermaid-js/mermaid-cli

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Сборка всех книг
      - name: Build all books
        run: |
          BOOKS_BUILT=0
          for book_dir in books/*/; do
            book=$(basename "$book_dir")
            [ "$book" = "_template" ] && continue
            [ ! -f "$book_dir/book.adoc" ] && continue

            echo "📦 Building $book..."
            mkdir -p "dist/$book"
            cd "$book_dir"
            bundle install --quiet
            bundle exec asciidoctor -b html5 -d book -o "../../dist/$book/index.html" book.adoc
            bundle exec asciidoctor-pdf -o "../../dist/$book/book.pdf" book.adoc
            cd ../..
            BOOKS_BUILT=$((BOOKS_BUILT + 1))
          done

          echo "📚 Всего собрано книг: $BOOKS_BUILT"
          if [ "$BOOKS_BUILT" -eq 0 ]; then
            echo "❌ Ошибка: не найдено ни одной книги для сборки!"
            echo "   Проверьте, что в books/ есть директории с book.adoc"
            ls -la books/
            exit 1
          fi

          echo "📁 Содержимое dist/:"
          ls -la dist/

      # Проверка, что dist/ не пуст
      - name: Check dist directory
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Ошибка: директория dist/ пуста или не существует!"
            echo "   Проверьте логи шага 'Build all books'"
            exit 1
          fi
          echo "✅ dist/ содержит файлы:"
          find dist/ -type f

      # Подготовка к деплою
      - name: Prepare deployment
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          cp -r shared _site/shared
          echo " Структура _site/:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
