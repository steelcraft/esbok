font:
  catalog:
    PT Serif:
      normal: PTSerif-Regular.ttf
      bold: PTSerif-Bold.ttf
      italic: PTSerif-Italic.ttf
      bold_italic: PTSerif-BoldItalic.ttf
    Fira Code:
      normal: FiraCode-Regular.ttf
      bold: FiraCode-Bold.ttf

base:
  font_family: PT Serif
  font_size: 11
  line_height: 1.4

heading:
  font_family: PT Serif
  font_style: bold
  h1_font_size: 24
  h2_font_size: 20
  h3_font_size: 16
  h4_font_size: 14
  h5_font_size: 12
  h6_font_size: 11
  margin_top: 20
  margin_bottom: 8

code:
  font_family: Fira Code
  font_size: 9
  line_height: 1.4
  background_color: F5F5F5
  border_color: E0E0E0
  border_radius: 4
  padding: [8, 8, 8, 8]

table:
  border_color: D0D0D0
  stripe_background_color: F9F9F9
  head:
    font_style: bold

footer:
  font_size: 8
  border_color: CCCCCC
  recto:
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'
